name: .NET tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Kosync.slnx

      - name: Build
        run: dotnet build Kosync.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Kosync.slnx --no-build --configuration Release
